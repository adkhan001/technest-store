<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TechNest electronics store - phones, laptops, audio, wearables, cameras, gaming and accessories."><title>Catalog connection | TechNest</title><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/catalog.css"><link rel="stylesheet" href="css/product.css"><link rel="stylesheet" href="css/commerce.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/premium.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/retail.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><div class="eyebrow">STORE CONNECTION</div><h1 class="page-title">The catalog, live.</h1></div></section><section class="section"><div class="container" style="max-width:850px"><p class="muted">This view reads the product table directly from Supabase. Reload to see current inventory after placing an order.</p><div class="note" id="connection-state">Checking connection…</div><p><button class="btn btn-outline" onclick="location.reload()">Refresh catalog</button></p><div class="db-proof" id="catalog-records"></div></div></section></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/products.js"></script><script src="js/backend.js"></script><script src="js/core/icons.js"></script><script src="js/core/store.js"></script><script src="js/core/utils.js"></script><script src="js/components/toast.js"></script><script src="js/components/modal.js"></script><script src="js/components/product-card.js"></script><script src="js/components/header.js"></script><script src="js/components/footer.js"></script><script src="js/app.js"></script><script>TNRenderHeader('about');TNRenderFooter();</script><script>document.addEventListener('DOMContentLoaded',async()=>{await TNBackend.ready;document.getElementById('connection-state').textContent=TNBackend.connected?'Connected to Supabase · '+TN_PRODUCTS.length+' product records · Read at '+new Date().toLocaleTimeString():'Connection unavailable';document.getElementById('catalog-records').innerHTML='<table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Available inventory</th></tr></thead><tbody>'+TN_PRODUCTS.map(p=>'<tr><td>'+TNU.escape(p.name)+'</td><td>'+TNU.escape(p.sku)+'</td><td>'+TNU.money(p.price)+'</td><td>'+p.stock+'</td></tr>').join('')+'</tbody></table>'});</script></body></html>
